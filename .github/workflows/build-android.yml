name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find APK
        if: always()
        run: |
          echo "================================"
          echo "APK FILES"
          echo "================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

      - name: Inspect APK
        if: always()
        run: |
          for apk in $(find "$GITHUB_WORKSPACE" -type f -name "*.apk"); do
            echo "================================"
            echo "APK: $apk"
            echo "================================"
            ls -lh "$apk"
            file "$apk"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
