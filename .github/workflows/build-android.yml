name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev \
            ccache

      - name: Install Python build tools
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install "Cython==0.29.36"
          python -m pip install buildozer

          echo "========================================"
          echo "PYTHON"
          echo "========================================"
          python --version

          echo "========================================"
          echo "CYTHON"
          echo "========================================"
          cython --version

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"
          buildozer --version

      - name: Verify project
        run: |
          set -e

          echo "========================================"
          echo "VERIFY FRAHOOSH PROJECT"
          echo "========================================"

          test -f buildozer.spec
          test -d mobile
          test -f mobile/main.py

          echo "Python syntax check..."
          python -m compileall -q mobile

          echo "Project structure:"
          find mobile -type f \
            ! -path "*/__pycache__/*" \
            | sort

          echo "Project verification completed."

      - name: Prepare buildozer.spec
        run: |
          set -e

          echo "========================================"
          echo "PREPARE BUILDOZER SPEC"
          echo "========================================"

          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          text = path.read_text()

          settings = {
              "android.api": "35",
              "android.minapi": "23",
              "android.ndk": "28c",
              "android.accept_sdk_license": "True",
          }

          lines = text.splitlines()
          result = []
          found = set()

          for line in lines:
              stripped = line.strip()
              replaced = False

              for key, value in settings.items():
                  if stripped.startswith(key + " ="):
                      result.append(f"{key} = {value}")
                      found.add(key)
                      replaced = True
                      break

              if not replaced:
                  result.append(line)

          for key, value in settings.items():
              if key not in found:
                  result.append(f"{key} = {value}")

          path.write_text("\n".join(result) + "\n")

          print(path.read_text())
          PY

      - name: Clean Buildozer
        run: |
          set -e

          echo "========================================"
          echo "CLEAN BUILDOZER"
          echo "========================================"

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Clean completed."

      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          ACCEPT_EULA: "Y"
        run: |
          set -e

          echo "========================================"
          echo "BUILD FRAHOOSH APK"
          echo "========================================"

          echo "Buildozer version:"
          buildozer --version

          echo "Starting Android build..."

          buildozer -v android debug

      - name: Verify APK
        run: |
          set -e

          echo "========================================"
          echo "VERIFY APK"
          echo "========================================"

          if [ ! -d bin ]; then
            echo "ERROR: bin directory does not exist."
            exit 1
          fi

          ls -lah bin/

          APK_COUNT=$(find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | wc -l)

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          APK=$(find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          echo "========================================"
          echo "APK GENERATED"
          echo "========================================"

          echo "APK:"
          echo "$APK"

          echo "Size:"
          ls -lh "$APK"

          echo "SHA256:"
          sha256sum "$APK"

          echo "APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
```
