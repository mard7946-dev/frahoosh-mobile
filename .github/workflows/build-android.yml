name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;28.0.13004108"


      - name: Android environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV


      - name: Install build tools
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install setuptools wheel
          python -m pip install "Cython==0.29.36"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "pip<25"


      - name: Check project
        run: |
          ls -la
          test -f buildozer.spec
          test -d mobile
          python --version
          buildozer --version


      - name: Clean old build
        run: |
          buildozer android clean || true
          rm -rf .buildozer


      - name: Build APK
        run: |
          yes | buildozer -v android debug


      - name: Check APK
        run: |
          ls -lh bin/
          find bin -name "*.apk"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
