name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            cmake \
            build-essential \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            ccache


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install buildozer

          python -m pip install "Cython==0.29.36"


      - name: Verify environment
        run: |
          echo "===== PYTHON ====="
          python --version

          echo "===== CYTHON ====="
          cython --version

          echo "===== JAVA ====="
          java -version

          echo "===== BUILDOZER ====="
          buildozer version

          echo "===== PROJECT ====="
          test -f buildozer.spec
          test -f mobile/main.py

          echo "Project files OK."


      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      - name: Build APK
        env:
          ACCEPT_EULA: "Y"
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer android debug


      - name: Check APK
        run: |
          echo "===== APK FILES ====="

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          echo "===== APK SIZE ====="

          ls -lah bin/

          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
