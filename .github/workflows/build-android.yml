name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653"

          "$ANDROID_HOME/ndk/25.2.9519653/ndk-build" --version

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install "Cython==0.29.36"

          python -m pip install "python-for-android==2024.1.21"

      - name: Verify environment
        run: |
          echo "======================================"
          echo "Python"
          echo "======================================"
          python --version

          echo ""
          echo "======================================"
          echo "Cython"
          echo "======================================"
          cython --version

          echo ""
          echo "======================================"
          echo "Android SDK"
          echo "======================================"
          echo "$ANDROID_HOME"

          echo ""
          echo "======================================"
          echo "Android API 35"
          echo "======================================"
          ls -la "$ANDROID_HOME/platforms/android-35"

          echo ""
          echo "======================================"
          echo "Build Tools"
          echo "======================================"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "======================================"
          echo "Python-for-Android"
          echo "======================================"
          python -m pythonforandroid.toolchain --help

      - name: Check Frahoosh Mobile
        run: |
          echo "======================================"
          echo "Frahoosh Mobile Project"
          echo "======================================"

          pwd

          echo ""
          echo "Checking required files..."

          test -f mobile/main.py
          test -d mobile/assets
          test -d mobile/screens
          test -d mobile/services

          echo ""
          echo "mobile/main.py:"
          ls -lh mobile/main.py

          echo ""
          echo "Mobile project files:"
          find mobile -maxdepth 3 -type f -print

      - name: Build Frahoosh APK
        run: |
          python -m pythonforandroid.toolchain apk \
            --private "$GITHUB_WORKSPACE/mobile" \
            --package ir.frahoosh.mobile \
            --name "Frahoosh Mobile" \
            --version 1.0.0 \
            --bootstrap sdl2 \
            --requirements python3,kivy,requests \
            --android-api 35 \
            --ndk-api 24 \
            --arch arm64-v8a \
            --arch armeabi-v7a \
            --color=always \
            --debug

      - name: Find APK
        if: always()
        run: |
          echo "======================================"
          echo "Searching for APK"
          echo "======================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "Searching python-for-android directory..."

          find "$HOME/.local/share/python-for-android" \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

      - name: Verify APK
        if: success()
        run: |
          echo "======================================"
          echo "Verifying APK"
          echo "======================================"

          APK="$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"

          echo ""
          echo "APK file type:"
          file "$APK"

          echo ""
          echo "APK SHA256:"
          sha256sum "$APK"

          echo ""
          echo "APK ZIP test:"
          unzip -t "$APK"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK file is empty."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" "$GITHUB_WORKSPACE/output/Frahoosh-Mobile.apk"

          echo ""
          echo "Final APK:"
          ls -lh "$GITHUB_WORKSPACE/output/Frahoosh-Mobile.apk"

      - name: Analyze APK
        if: success()
        run: |
          echo "======================================"
          echo "APK ANALYSIS"
          echo "======================================"

          APK="$GITHUB_WORKSPACE/output/Frahoosh-Mobile.apk"

          echo ""
          echo "APK:"
          echo "$APK"

          echo ""
          echo "======================================"
          echo "APKSIGNER"
          echo "======================================"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ -f "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          else
            echo "WARNING: apksigner not found."
          fi

          echo ""
          echo "======================================"
          echo "AAPT DUMP BADGING"
          echo "======================================"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          if [ -f "$AAPT" ]; then
            "$AAPT" dump badging "$APK"
          else
            echo "WARNING: aapt not found."
          fi

          echo ""
          echo "======================================"
          echo "APK CONTENT - NATIVE LIBRARIES"
          echo "======================================"

          unzip -l "$APK" | grep "lib/"

          echo ""
          echo "======================================"
          echo "APK CONTENT - MANIFEST"
          echo "======================================"

          unzip -l "$APK" | grep "AndroidManifest.xml"

          echo ""
          echo "======================================"
          echo "APK ANALYSIS COMPLETE"
          echo "======================================"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-APK
          path: output/Frahoosh-Mobile.apk
          if-no-files-found: error
