name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev \
            ccache

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configure Android environment
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=23" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Installed platforms:"
          ls -la "$ANDROID_HOME/platforms"

          echo "Installed build tools:"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Install Buildozer
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install "Cython==0.29.36"
          python -m pip install "buildozer==1.5.0"

          echo "Python:"
          python --version

          echo "Cython:"
          cython --version

          echo "Buildozer:"
          buildozer --version

      - name: Verify project
        run: |
          set -e

          test -f buildozer.spec
          test -d mobile
          test -f mobile/main.py

          python -m compileall -q mobile

          echo "Project verification successful."

          echo "buildozer.spec:"
          cat buildozer.spec

          echo "Mobile files:"
          find mobile -type f \
            ! -path "*/__pycache__/*" \
            | sort

      - name: Clean Buildozer
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin
          rm -rf output

          mkdir -p bin
          mkdir -p output

      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -e

          echo "Starting Frahoosh Android build..."

          buildozer -v android debug

      - name: Verify APK
        run: |
          set -e

          APK="$(find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo "Contents of bin:"
            ls -lah bin
            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          cp "$APK" output/Frahoosh-Mobile.apk

          echo "APK size:"
          ls -lh output/Frahoosh-Mobile.apk

          echo "APK SHA256:"
          sha256sum output/Frahoosh-Mobile.apk

          echo "Testing APK archive..."
          unzip -t output/Frahoosh-Mobile.apk

          echo "Verifying APK signature..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            output/Frahoosh-Mobile.apk

          echo "APK verification successful."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-APK
          path: output/Frahoosh-Mobile.apk
          if-no-files-found: error
``
