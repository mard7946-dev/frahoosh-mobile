```yaml
name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache \
            libltdl-dev \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install buildozer
          python -m pip install "cython==0.29.36"

          echo "Buildozer:"
          buildozer --version

          echo "Cython:"
          cython --version

      - name: Configure Android SDK
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"

          test -d "$SDK"
          test -f "$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK:"
          echo "$SDK"

          echo "sdkmanager:"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK components
        run: |
          set -e

          SDK="$ANDROID_HOME"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Checking SDK..."

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          test -f "$SDK/build-tools/35.0.0/aidl"

          echo "SDK is ready."

      - name: Prepare Buildozer SDK compatibility
        run: |
          set -e

          SDK="$ANDROID_HOME"

          echo "Preparing Buildozer SDK compatibility path..."

          if [ -e "$SDK/tools" ] || [ -L "$SDK/tools" ]; then
            rm -rf "$SDK/tools"
          fi

          ln -s "$SDK/cmdline-tools/latest" "$SDK/tools"

          test -f "$SDK/tools/bin/sdkmanager"

          echo "Compatibility sdkmanager:"
          "$SDK/tools/bin/sdkmanager" --version

      - name: Configure buildozer.spec
        run: |
          set -e

          SDK="$ANDROID_HOME"

          python - "$SDK" <<'PY'
          import sys
          from pathlib import Path

          sdk = sys.argv[1]
          path = Path("buildozer.spec")

          text = path.read_text()

          lines = text.splitlines()

          # Remove old android.sdk_path entries.
          lines = [
              line
              for line in lines
              if not line.strip().startswith("android.sdk_path")
          ]

          # Insert android.sdk_path into [app].
          result = []
          inserted = False

          for line in lines:
              result.append(line)

              if line.strip() == "[app]" and not inserted:
                  result.append(f"android.sdk_path = {sdk}")
                  inserted = True

          if not inserted:
              raise SystemExit("ERROR: [app] section not found")

          path.write_text("\n".join(result) + "\n")

          print("android.sdk_path configured:")
          print(sdk)
          PY

          echo "Configured buildozer.spec:"
          grep -n "android.sdk_path" buildozer.spec

      - name: Verify project
        run: |
          set -e

          echo "Project:"
          pwd

          echo ""
          echo "buildozer.spec:"
          cat buildozer.spec

          echo ""
          echo "Mobile files:"
          find mobile -maxdepth 4 -type f -print | sort

      - name: Clean Buildozer
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      - name: Verify Android environment
        run: |
          set -e

          echo "========================================"
          echo "ANDROID ENVIRONMENT"
          echo "========================================"

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Modern sdkmanager:"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

          echo ""
          echo "Buildozer compatibility sdkmanager:"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

          echo ""
          echo "Android platform:"
          test -d "$ANDROID_HOME/platforms/android-35"

          echo ""
          echo "Android build-tools:"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "AIDL:"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo ""
          echo "Everything ready."

      - name: Build APK
        env:
          ACCEPT_EULA: "Y"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -e

          echo "========================================"
          echo "BUILDING FRAHOOSH APK"
          echo "========================================"

          buildozer android debug

      - name: Check APK
        run: |
          set -e

          echo "========================================"
          echo "APK RESULT"
          echo "========================================"

          find bin -maxdepth 1 -type f -name "*.apk" -print

          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            ls -lah bin || true
            exit 1
          fi

          echo ""
          echo "APK generated successfully:"
          ls -lah bin/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
```
