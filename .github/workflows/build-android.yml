name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            curl \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev \
            ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install "Cython==0.29.36"
          python -m pip install buildozer

          python --version
          cython --version
          buildozer --version

      - name: Verify project
        run: |
          set -e

          test -f buildozer.spec
          test -d mobile
          test -f mobile/main.py

          python -m compileall -q mobile

          echo "Project verified."

      - name: Configure Buildozer
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          text = path.read_text()

          replacements = {
              "android.api": "35",
              "android.minapi": "23",
              "android.ndk": "28c",
              "android.ndk_api": "23",
              "android.archs": "arm64-v8a,armeabi-v7a",
              "android.accept_sdk_license": "True",
              "android.skip_update": "False",
          }

          lines = text.splitlines()
          result = []
          found = set()

          for line in lines:
              stripped = line.strip()

              replaced = False

              for key, value in replacements.items():
                  if stripped.startswith(key + " =") or stripped.startswith("#" + key + " ="):
                      result.append(f"{key} = {value}")
                      found.add(key)
                      replaced = True
                      break

              if not replaced:
                  result.append(line)

          missing = [
              f"{key} = {value}"
              for key, value in replacements.items()
              if key not in found
          ]

          if missing:
              result.append("")
              result.append("[app]")
              result.extend(missing)

          path.write_text("\n".join(result) + "\n")

          print(path.read_text())
          PY

      - name: Clean Buildozer
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          ACCEPT_EULA: "Y"
        run: |
          set -e

          echo "Starting Android build..."

          yes | buildozer -v android debug

      - name: Verify APK
        run: |
          set -e

          echo "APK files:"
          find bin -maxdepth 1 -type f -name "*.apk" -print

          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          APK=$(find bin -maxdepth 1 -type f -name "*.apk" | head -n 1)

          echo "APK generated:"
          echo "$APK"

          echo "APK size:"
          ls -lh "$APK"

          echo "SHA256:"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
``
