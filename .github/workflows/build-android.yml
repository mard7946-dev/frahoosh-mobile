name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ========================================
      # 1. Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # 2. Python 3.11
      # ========================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ========================================
      # 3. Java 17
      # ========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ========================================
      # 4. Linux dependencies
      # ========================================
      - name: Install Linux dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev \
            ccache


      # ========================================
      # 5. Android SDK
      # ========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ========================================
      # 6. Configure Android environment
      # ========================================
      - name: Configure Android environment
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"

          echo "----------------------------------------"
          echo "SDK Manager"
          echo "----------------------------------------"

          sdkmanager --version

          echo "----------------------------------------"
          echo "ADB"
          echo "----------------------------------------"

          adb version


      # ========================================
      # 7. Accept Android licenses
      # ========================================
      - name: Accept Android SDK licenses
        run: |
          set -e

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses > /dev/null || true

          echo "Android licenses processed."


      # ========================================
      # 8. Install Android SDK components
      # ========================================
      - name: Install Android SDK components
        run: |
          set -e

          echo "Installing Android SDK components..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

          echo ""
          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms"

          echo ""
          echo "Installed Android build-tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo ""
          echo "Android SDK installation completed."


      # ========================================
      # 9. Install Buildozer + Cython
      # ========================================
      - name: Install Buildozer and Cython
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install "Cython==0.29.36"
          python -m pip install "buildozer==1.5.0"

          echo ""
          echo "========================================"
          echo "Buildozer"
          echo "========================================"

          buildozer --version

          echo ""
          echo "========================================"
          echo "Cython"
          echo "========================================"

          cython --version


      # ========================================
      # 10. Verify project
      # ========================================
      - name: Verify Frahoosh project
        run: |
          set -e

          echo "========================================"
          echo "Project verification"
          echo "========================================"

          test -f buildozer.spec
          test -d mobile
          test -f mobile/main.py

          echo ""
          echo "buildozer.spec:"
          echo "----------------------------------------"
          cat buildozer.spec
          echo "----------------------------------------"

          echo ""
          echo "Mobile files:"
          find mobile -maxdepth 4 -type f -print | sort

          echo ""
          echo "Python syntax check:"

          python -m compileall -q mobile

          echo ""
          echo "Project verification successful."


      # ========================================
      # 11. Clean previous Buildozer files
      # ========================================
      - name: Clean Buildozer
        run: |
          set -e

          echo "Cleaning previous Buildozer files..."

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Clean build directory ready."


      # ========================================
      # 12. Build APK
      # ========================================
      - name: Build APK
        env:
          ACCEPT_EULA: "Y"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

        run: |
          set -e

          echo "========================================"
          echo "Starting Frahoosh Android build"
          echo "========================================"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "SDK Manager:"
          sdkmanager --version

          echo ""
          echo "========================================"
          echo "Running Buildozer"
          echo "========================================"

          buildozer -v android debug


      # ========================================
      # 13. Check APK
      # ========================================
      - name: Check APK
        run: |
          set -e

          echo "========================================"
          echo "Checking generated APK"
          echo "========================================"

          ls -lah bin/

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"


      # ========================================
      # 14. Verify APK archive
      # ========================================
      - name: Verify APK
        run: |
          set -e

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          test -n "$APK"

          echo "Testing APK archive..."

          unzip -t "$APK"

          echo ""
          echo "APK archive is valid."


      # ========================================
      # 15. Upload APK
      # ========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-APK
          path: bin/*.apk
          if-no-files-found: error
