name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ========================================
      # 1. Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # 2. Python 3.11
      # ========================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ========================================
      # 3. Java 17
      # ========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ========================================
      # 4. Linux dependencies
      # ========================================
      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache \
            libltdl-dev \
            build-essential


      # ========================================
      # 5. Install Buildozer
      # ========================================
      - name: Install Buildozer
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install buildozer

          python -m pip install "cython==0.29.36"

          echo "========================================"
          echo "Buildozer version"
          echo "========================================"

          buildozer --version

          echo "========================================"
          echo "Cython version"
          echo "========================================"

          cython --version


      # ========================================
      # 6. Configure Android environment
      # ========================================
      - name: Configure Android environment
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Android SDK"
          echo "========================================"

          echo "$SDK"

          echo "========================================"
          echo "Finding sdkmanager"
          echo "========================================"

          if [ -f "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$SDK/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager not found."

            find "$SDK" \
              -type f \
              -name "sdkmanager" \
              -print || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "========================================"
          echo "sdkmanager version"
          echo "========================================"

          "$SDKMANAGER" --version


      # ========================================
      # 7. Accept licenses + install SDK
      # ========================================
      - name: Install Android SDK components
        run: |
          set -e

          SDK="$ANDROID_HOME"
          SDKMANAGER="$SDKMANAGER"

          echo "========================================"
          echo "Using sdkmanager"
          echo "========================================"

          echo "$SDKMANAGER"

          test -f "$SDKMANAGER"

          echo "========================================"
          echo "Accepting Android SDK licenses"
          echo "========================================"

          yes | "$SDKMANAGER" --licenses || true

          echo "========================================"
          echo "Installing Android SDK packages"
          echo "========================================"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

          echo "========================================"
          echo "Installed platforms"
          echo "========================================"

          ls -lah "$SDK/platforms"

          echo "========================================"
          echo "Installed build tools"
          echo "========================================"

          ls -lah "$SDK/build-tools"


      # ========================================
      # 8. Patch Buildozer sdkmanager
      # ========================================
      - name: Patch Buildozer SDK manager
        run: |
          set -e

          BUILD0ZER_ANDROID="$(
            python - <<'PY'
          import buildozer.targets.android
          print(buildozer.targets.android.__file__)
          PY
          )"

          echo "========================================"
          echo "Buildozer Android target"
          echo "========================================"

          echo "$BUILD0ZER_ANDROID"

          echo "========================================"
          echo "Original sdkmanager_path"
          echo "========================================"

          grep -n -A20 -B5 \
            "def sdkmanager_path" \
            "$BUILD0ZER_ANDROID" || true

          python - "$BUILD0ZER_ANDROID" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text()

          pattern = re.compile(
              r'(?ms)^(\s*@property\s*\n'
              r'\s*def sdkmanager_path\(self\):.*?)(?=^\s*@property|^\s*def |\Z)'
          )

          match = pattern.search(text)

          if not match:
              print("ERROR: sdkmanager_path property was not found.")
              sys.exit(1)

          old_block = match.group(1)

          print("========================================")
          print("Found sdkmanager_path property")
          print("========================================")
          print(old_block)

          indent = "    "

          new_block = """    @property
              def sdkmanager_path(self):
                  sdk_manager_name = (
                      'sdkmanager.bat'
                      if platform in ('win32', 'cygwin')
                      else 'sdkmanager'
                  )

                  if platform in ('win32', 'cygwin'):
                      sdkmanager_path = join(
                          self.android_sdk_dir,
                          'cmdline-tools',
                          'latest',
                          'bin',
                          sdk_manager_name
                      )
                  else:
                      sdkmanager_path = join(
                          self.android_sdk_dir,
                          'cmdline-tools',
                          'latest',
                          'bin',
                          sdk_manager_name
                      )

                  if not os.path.isfile(sdkmanager_path):
                      raise BuildozerException(
                          (
                              'sdkmanager path "{}" does not exist, '
                              'sdkmanager is not installed'
                          ).format(sdkmanager_path)
                      )

                  return sdkmanager_path

          """

          # Normalize accidental indentation from the multiline string.
          lines = new_block.splitlines()

          normalized = []

          for line in lines:
              if line.strip():
                  normalized.append(line.strip() if line.startswith("              ") else line)
              else:
                  normalized.append("")

          # Build the property with exact class-level indentation.
          new_block = """    @property
    def sdkmanager_path(self):
        sdk_manager_name = (
            'sdkmanager.bat'
            if platform in ('win32', 'cygwin')
            else 'sdkmanager'
        )

        sdkmanager_path = join(
            self.android_sdk_dir,
            'cmdline-tools',
            'latest',
            'bin',
            sdk_manager_name
        )

        if not os.path.isfile(sdkmanager_path):
            raise BuildozerException(
                (
                    'sdkmanager path "{}" does not exist, '
                    'sdkmanager is not installed'
                ).format(sdkmanager_path)
            )

        return sdkmanager_path

  """

          text = (
              text[:match.start()]
              + new_block
              + text[match.end():]
          )

          path.write_text(text)

          print("========================================")
          print("SUCCESS: Buildozer sdkmanager patched")
          print("========================================")
          PY

          echo "========================================"
          echo "Verify patched Buildozer"
          echo "========================================"

          grep -n -A25 -B3 \
            "def sdkmanager_path" \
            "$BUILD0ZER_ANDROID"

          echo "========================================"
          echo "Verify sdkmanager"
          echo "========================================"

          test -f "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ========================================
      # 9. Verify project
      # ========================================
      - name: Verify Frahoosh project
        run: |
          set -e

          echo "========================================"
          echo "Project root"
          echo "========================================"

          pwd

          echo ""
          echo "========================================"
          echo "buildozer.spec"
          echo "========================================"

          cat buildozer.spec

          echo ""
          echo "========================================"
          echo "Mobile files"
          echo "========================================"

          find mobile \
            -maxdepth 3 \
            -type f \
            -print \
            | sort


      # ========================================
      # 10. Clean Buildozer
      # ========================================
      - name: Clean Buildozer
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Clean build environment ready."


      # ========================================
      # 11. Build APK
      # ========================================
      - name: Build APK
        env:
          ACCEPT_EULA: "Y"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -e

          echo "========================================"
          echo "Starting Frahoosh Android build"
          echo "========================================"

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "========================================"
          echo "BUILD APK"
          echo "========================================"

          buildozer android debug


      # ========================================
      # 12. Check APK
      # ========================================
      - name: Check APK
        run: |
          set -e

          echo "========================================"
          echo "Generated APK"
          echo "========================================"

          ls -lah bin/

          APK_COUNT="$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          echo ""
          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK successfully generated"
          echo "========================================"

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # ========================================
      # 13. Upload APK
      # ========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
