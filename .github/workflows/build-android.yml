name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. Python 3.11.9
      # ==========================================
      - name: Setup Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"


      # ==========================================
      # 3. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 4. System dependencies
      # ==========================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache


      # ==========================================
      # 5. Install Buildozer
      # ==========================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<70"
          python -m pip install wheel
          python -m pip install "cython==0.29.36"
          python -m pip install buildozer


      # ==========================================
      # 6. Verify environment
      # ==========================================
      - name: Verify environment
        run: |
          echo "========== PYTHON =========="
          python --version
          which python

          echo "========== CYTHON =========="
          cython --version

          echo "========== BUILDOZER =========="
          buildozer version

          echo "========== JAVA =========="
          java -version


      # ==========================================
      # 7. Clean project build data
      # ==========================================
      - name: Clean project build data
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin


      # ==========================================
      # 8. Build APK
      # ==========================================
      - name: Build APK
        env:
          ACCEPT_EULA: "Y"
          P4A_RELEASE: "0"
        run: |
          buildozer -v android debug


      # ==========================================
      # 9. Check APK
      # ==========================================
      - name: Check APK
        run: |
          echo "========== APK FILES =========="

          ls -lah bin/

          echo "========== APK COUNT =========="

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi


      # ==========================================
      # 10. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
