name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # -----------------------------
      # 1. Checkout
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # -----------------------------
      # 2. Setup Python 3.11
      # -----------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # -----------------------------
      # 3. Setup Java 17
      # -----------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # -----------------------------
      # 4. Install system dependencies
      # -----------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # -----------------------------
      # 5. Setup Android SDK
      # -----------------------------
      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"

          export CMDLINE_TOOLS="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "CMDLINE_TOOLS=$CMDLINE_TOOLS"

          ls -la "$CMDLINE_TOOLS"

          "$CMDLINE_TOOLS/sdkmanager" --version

          yes | "$CMDLINE_TOOLS/sdkmanager" --licenses || true

          "$CMDLINE_TOOLS/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          yes | "$CMDLINE_TOOLS/sdkmanager" --licenses || true


      # -----------------------------
      # 6. Install Buildozer
      # -----------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.36"


      # -----------------------------
      # 7. Clean Buildozer
      # -----------------------------
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin


      # -----------------------------
      # 8. Build APK
      # -----------------------------
      - name: Build APK
        run: |
          buildozer android debug


      # -----------------------------
      # 9. Check APK
      # -----------------------------
      - name: Check APK
        run: |
          echo "Generated APK files:"
          ls -lah bin/


      # -----------------------------
      # 10. Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
