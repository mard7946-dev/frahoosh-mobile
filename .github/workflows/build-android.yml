name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Python 3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 4. Linux dependencies
      - name: Install Linux dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev \
            ccache

      # 5. Buildozer + Cython
      - name: Install Buildozer and Cython
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install "Cython==0.29.36"
          python -m pip install "buildozer==1.5.0"

          echo "========================================"
          echo "Python"
          echo "========================================"
          python --version

          echo "========================================"
          echo "Cython"
          echo "========================================"
          cython --version

          echo "========================================"
          echo "Buildozer"
          echo "========================================"
          buildozer --version

      # 6. Verify project before starting Android build
      - name: Verify Frahoosh project
        run: |
          set -e

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          pwd

          echo ""
          echo "Root files:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            ! -path "./.buildozer/*" \
            | sort

          echo ""
          echo "Checking buildozer.spec..."
          test -f buildozer.spec

          echo ""
          echo "Checking mobile directory..."
          test -d mobile

          echo ""
          echo "Checking mobile/main.py..."
          test -f mobile/main.py

          echo ""
          echo "Compiling Python files..."
          python -m compileall -q mobile

          echo ""
          echo "Mobile files:"
          find mobile -type f \
            ! -path "*/__pycache__/*" \
            | sort

          echo ""
          echo "========================================"
          echo "buildozer.spec"
          echo "========================================"

          cat buildozer.spec

      # 7. Remove old local Buildozer cache
      - name: Clean Buildozer cache
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Clean build directories created."

      # 8. Build APK
      #
      # IMPORTANT:
      # Do NOT configure Android SDK manually here.
      # Buildozer will install its own compatible SDK,
      # platform tools and NDK.
      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          ACCEPT_EULA: "Y"
        run: |
          set -e

          echo "========================================"
          echo "STARTING BUILD"
          echo "========================================"

          yes | buildozer -v android debug

      # 9. Verify APK
      - name: Verify generated APK
        run: |
          set -e

          echo "========================================"
          echo "CHECKING APK"
          echo "========================================"

          echo "bin directory:"
          ls -lah bin/

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Contents of bin:"
            find bin -maxdepth 2 -type f -print
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"

          echo ""
          echo "APK SHA256:"
          sha256sum "$APK"

          echo ""
          echo "Testing APK archive..."
          unzip -t "$APK"

          echo ""
          echo "APK verification completed successfully."

      # 10. Prepare final APK
      - name: Prepare APK
        run: |
          set -e

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          test -n "$APK"

          mkdir -p output

          cp "$APK" output/Frahoosh-Mobile.apk

          echo "Final APK:"
          ls -lh output/Frahoosh-Mobile.apk

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-APK
          path: output/Frahoosh-Mobile.apk
          if-no-files-found: error
```
