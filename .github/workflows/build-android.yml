name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev \
            ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install "Cython==0.29.36"
          python -m pip install buildozer

          echo "========================================"
          echo "Python"
          echo "========================================"
          python --version

          echo "========================================"
          echo "Cython"
          echo "========================================"
          cython --version

          echo "========================================"
          echo "Buildozer"
          echo "========================================"
          buildozer --version

      - name: Verify Frahoosh project
        run: |
          set -e

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          pwd

          echo ""
          echo "Checking buildozer.spec..."
          test -f buildozer.spec
          echo "buildozer.spec found."

          echo ""
          echo "Checking mobile directory..."
          test -d mobile
          echo "mobile directory found."

          echo ""
          echo "Checking main.py..."
          test -f mobile/main.py
          echo "mobile/main.py found."

          echo ""
          echo "Checking Python syntax..."
          python -m compileall -q mobile
          echo "Python syntax OK."

          echo ""
          echo "Frahoosh mobile files:"
          find mobile -type f \
            ! -path "*/__pycache__/*" \
            | sort

      - name: Clean Buildozer
        run: |
          set -e

          echo "Cleaning previous Buildozer files..."

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Clean build environment ready."

      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          ACCEPT_EULA: "Y"
        run: |
          set -e

          echo "========================================"
          echo "BUILDING FRAHOOSH APK"
          echo "========================================"

          buildozer -v android debug

      - name: Verify APK
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          echo ""
          echo "Contents of bin:"
          ls -lah bin/

          echo ""
          echo "Searching for APK..."

          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No APK was generated."
            exit 1
          fi

          APK=$(find bin -maxdepth 1 -type f -name "*.apk" | head -n 1)

          echo ""
          echo "APK successfully generated:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"

          echo ""
          echo "APK SHA256:"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error

