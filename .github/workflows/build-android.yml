name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Python 3.11
      # ==========================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 3. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 4. System dependencies
      # ==========================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache

      # ==========================================
      # 5. Install Buildozer
      # ==========================================
      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip setuptools wheel

          pip install buildozer

          pip install "cython==0.29.36"

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Cython:"
          cython --version

      # ==========================================
      # 6. Configure Android environment
      # ==========================================
      - name: Configure Android environment
        shell: bash
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      # ==========================================
      # 7. Verify modern sdkmanager
      # ==========================================
      - name: Verify modern sdkmanager
        shell: bash
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "SDK:"
          echo "$SDK"

          echo ""
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found:"
            echo "$SDKMANAGER"
            exit 1
          fi

          chmod +x "$SDKMANAGER"

          echo ""
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          echo ""
          echo "Modern sdkmanager is working."

      # ==========================================
      # 8. Patch Buildozer
      #
      # Buildozer currently searches for:
      # tools/bin/sdkmanager
      #
      # GitHub runner provides:
      # cmdline-tools/latest/bin/sdkmanager
      #
      # Patch the exact source line.
      # ==========================================
      - name: Patch Buildozer sdkmanager path
        shell: bash
        run: |
          set -e

          BUILDOZER_ANDROID=$(python - <<'PY'
          import buildozer.targets.android
          print(buildozer.targets.android.__file__)
          PY
          )

          echo "Buildozer Android target:"
          echo "$BUILDOZER_ANDROID"

          echo ""
          echo "Current sdkmanager code:"
          grep -n -A12 -B5 "def sdkmanager_path" "$BUILDOZER_ANDROID"

          python - "$BUILDOZER_ANDROID" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          old = "self.android_sdk_dir, 'tools', 'bin', sdk_manager_name"

          new = "self.android_sdk_dir, 'cmdline-tools', 'latest', 'bin', sdk_manager_name"

          if new in text:
              print("Buildozer is already patched.")
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("Buildozer sdkmanager path patched successfully.")
          else:
              print("ERROR: Could not find expected Buildozer sdkmanager path.")
              print()
              print("Expected source fragment:")
              print(old)
              print()
              print("Actual sdkmanager section:")
              
              start = text.find("def sdkmanager_path")
              
              if start == -1:
                  print("sdkmanager_path function was not found.")
              else:
                  print(text[start:start + 1500])

              raise SystemExit(1)
          PY

          echo ""
          echo "Patched sdkmanager code:"
          grep -n -A12 -B5 "def sdkmanager_path" "$BUILDOZER_ANDROID"

          echo ""
          echo "Verifying patch..."

          if ! grep -q "cmdline-tools.*latest.*bin.*sdk_manager_name" "$BUILDOZER_ANDROID"; then
            echo "ERROR: Buildozer sdkmanager patch verification failed."
            exit 1
          fi

          echo ""
          echo "Buildozer sdkmanager patch: OK"

      # ==========================================
      # 9. Accept Android SDK licenses
      # ==========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses || true

          echo ""
          echo "Android SDK licenses processed."

      # ==========================================
      # 10. Install required Android SDK components
      # ==========================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "Installing platform-tools..."
          "$SDKMANAGER" "platform-tools"

          echo ""
          echo "Installing Android platform 33..."
          "$SDKMANAGER" "platforms;android-33"

          echo ""
          echo "Installing Build Tools 35.0.0..."
          "$SDKMANAGER" "build-tools;35.0.0"

          echo ""
          echo "Installed Android platforms:"
          ls -la "$SDK/platforms" || true

          echo ""
          echo "Installed Build Tools:"
          ls -la "$SDK/build-tools"

      # ==========================================
      # 11. Remove incompatible newer Build Tools
      # ==========================================
      - name: Keep Build Tools 35.0.0 only
        shell: bash
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"

          echo "Build Tools before cleanup:"
          ls -la "$SDK/build-tools"

          for dir in "$SDK"/build-tools/*; do
            if [ -d "$dir" ]; then
              version="$(basename "$dir")"

              if [ "$version" != "35.0.0" ]; then
                echo "Removing incompatible Build Tools: $version"
                sudo rm -rf "$dir"
              fi
            fi
          done

          echo ""
          echo "Build Tools after cleanup:"
          ls -la "$SDK/build-tools"

          test -d "$SDK/build-tools/35.0.0"

          test -x "$SDK/build-tools/35.0.0/aapt"
          test -x "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "AIDL:"
          "$SDK/build-tools/35.0.0/aidl" --help > /dev/null

          echo ""
          echo "Build Tools 35.0.0 verification: OK"

      # ==========================================
      # 12. Verify Android SDK completely
      # ==========================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"

          echo "=========================================="
          echo "ANDROID ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "=========================================="
          echo "SDK MANAGER"
          echo "=========================================="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo ""
          echo "=========================================="
          echo "PLATFORM TOOLS"
          echo "=========================================="

          test -x "$SDK/platform-tools/adb"
          "$SDK/platform-tools/adb" version

          echo ""
          echo "=========================================="
          echo "ANDROID PLATFORM 33"
          echo "=========================================="

          test -d "$SDK/platforms/android-33"

          echo ""
          echo "=========================================="
          echo "BUILD TOOLS 35.0.0"
          echo "=========================================="

          test -d "$SDK/build-tools/35.0.0"
          test -x "$SDK/build-tools/35.0.0/aapt"
          test -x "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "=========================================="
          echo "AIDL"
          echo "=========================================="

          "$SDK/build-tools/35.0.0/aidl" --help > /dev/null

          echo ""
          echo "=========================================="
          echo "ANDROID SDK VERIFICATION SUCCESSFUL"
          echo "=========================================="

      # ==========================================
      # 13. Verify Buildozer patch one more time
      # ==========================================
      - name: Verify Buildozer patch
        shell: bash
        run: |
          set -e

          BUILDOZER_ANDROID=$(python - <<'PY'
          import buildozer.targets.android
          print(buildozer.targets.android.__file__)
          PY
          )

          echo "Buildozer Android target:"
          echo "$BUILDOZER_ANDROID"

          if grep -q "self.android_sdk_dir, 'tools', 'bin', sdk_manager_name" "$BUILDOZER_ANDROID"; then
            echo "ERROR: Buildozer still uses legacy tools/bin/sdkmanager."
            exit 1
          fi

          if ! grep -q "cmdline-tools.*latest.*bin.*sdk_manager_name" "$BUILDOZER_ANDROID"; then
            echo "ERROR: Buildozer does not use modern cmdline-tools sdkmanager."
            exit 1
          fi

          echo ""
          echo "Buildozer sdkmanager configuration: CORRECT"

      # ==========================================
      # 14. Clean project
      # ==========================================
      - name: Clean project build
        shell: bash
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin

          echo "Project build directories cleaned."

      # ==========================================
      # 15. Build APK
      # ==========================================
      - name: Build APK
        shell: bash
        env:
          ACCEPT_EULA: "Y"
        run: |
          set -e

          echo "Starting Buildozer Android build..."

          buildozer android debug

      # ==========================================
      # 16. Verify APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Generated APK files:"
          ls -lah bin/

          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          echo ""
          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK successfully generated."

      # ==========================================
      # 17. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
