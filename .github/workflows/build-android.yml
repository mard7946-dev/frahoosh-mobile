name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------
      # 1. Checkout
      # --------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------
      # 2. Python 3.11
      # --------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------
      # 3. Java 17
      # --------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------
      # 4. System dependencies
      # --------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache

      # --------------------------------
      # 5. Install Buildozer
      # --------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install "cython==0.29.36"

      # --------------------------------
      # 6. Android environment
      # --------------------------------
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"

          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      # --------------------------------
      # 7. Configure legacy sdkmanager
      # --------------------------------
      - name: Configure SDK manager compatibility
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"
          MODERN_SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          LEGACY_DIR="$SDK/tools/bin"
          LEGACY_SDKMANAGER="$LEGACY_DIR/sdkmanager"

          echo "SDK:"
          echo "$SDK"

          echo "Modern sdkmanager:"
          echo "$MODERN_SDKMANAGER"

          if [ ! -f "$MODERN_SDKMANAGER" ]; then
            echo "ERROR: Modern sdkmanager was not found."
            exit 1
          fi

          if [ ! -x "$MODERN_SDKMANAGER" ]; then
            echo "ERROR: Modern sdkmanager is not executable."
            ls -l "$MODERN_SDKMANAGER"
            exit 1
          fi

          echo "Creating legacy SDK manager directory..."

          sudo mkdir -p "$LEGACY_DIR"

          echo "Creating real wrapper..."

          sudo rm -f "$LEGACY_SDKMANAGER"

          sudo tee "$LEGACY_SDKMANAGER" > /dev/null <<'EOF'
          #!/bin/sh
          exec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@"
          EOF

          sudo chmod 755 "$LEGACY_SDKMANAGER"

          echo "Legacy sdkmanager created:"
          ls -la "$LEGACY_DIR"

          echo "Testing legacy sdkmanager..."

          "$LEGACY_SDKMANAGER" --version

      # --------------------------------
      # 8. Accept Android SDK licenses
      # --------------------------------
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

          echo "Installed SDK packages:"
          "$SDKMANAGER" --list_installed || true

      # --------------------------------
      # 9. Clean old Buildozer data
      # --------------------------------
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      # --------------------------------
      # 10. Build APK
      # --------------------------------
      - name: Build APK
        env:
          ACCEPT_EULA: "Y"
        run: |
          buildozer android debug

      # --------------------------------
      # 11. Check APK
      # --------------------------------
      - name: Check APK
        run: |
          echo "Generated APK files:"
          ls -lah bin/

          echo "APK count:"
          find bin -maxdepth 1 -type f -name "*.apk" | wc -l

      # --------------------------------
      # 12. Upload APK
      # --------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
