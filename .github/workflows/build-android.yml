name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------
      # 1. Checkout
      # --------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Python 3.11
      # --------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------
      # 3. Java 17
      # --------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------
      # 4. System dependencies
      # --------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache


      # --------------------------------
      # 5. Install Buildozer + Cython
      # --------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install buildozer

          pip install "cython==0.29.36"

          echo "Buildozer version:"
          buildozer --version

          echo "Cython version:"
          cython --version


      # --------------------------------
      # 6. Configure Android SDK
      # --------------------------------
      - name: Configure Android SDK
        run: |
          SDK="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"

          echo "ANDROID SDK:"
          echo "$SDK"

          echo "SDK contents:"
          ls -lah "$SDK" || true


      # --------------------------------
      # 7. Accept Android SDK licenses
      # --------------------------------
      - name: Accept Android SDK licenses
        run: |
          SDK="$ANDROID_HOME"

          mkdir -p "$SDK/licenses"

          cat > "$SDK/licenses/android-sdk-license" <<'EOF'
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF

          cat > "$SDK/licenses/android-sdk-preview-license" <<'EOF'
          84831b9409646a918e30573bab4c9c91346d8abd
          EOF

          echo "Android SDK licenses:"
          ls -lah "$SDK/licenses"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found:"
            echo "$SDKMANAGER"
            exit 1
          fi

          echo "sdkmanager:"
          "$SDKMANAGER" --version

          echo "Checking licenses:"
          yes | "$SDKMANAGER" --licenses || true


      # --------------------------------
      # 8. Install required Android SDK
      # --------------------------------
      - name: Install Android SDK packages
        run: |
          SDK="$ANDROID_HOME"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "Installing required SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;37.0.0"

          echo
          echo "Installed Android platforms:"
          ls -lah "$SDK/platforms" || true

          echo
          echo "Installed Build Tools:"
          ls -lah "$SDK/build-tools" || true

          echo
          echo "AIDL:"
          ls -lah "$SDK/build-tools/37.0.0/aidl"

          test -x "$SDK/build-tools/37.0.0/aidl"

          echo
          echo "AIDL executable test:"
          "$SDK/build-tools/37.0.0/aidl" || test $? -eq 1


      # --------------------------------
      # 9. Configure Buildozer SDK path
      # --------------------------------
      - name: Configure Buildozer paths
        run: |
          SDK="$ANDROID_HOME"

          echo "Using Android SDK:"
          echo "$SDK"

          test -d "$SDK"
          test -d "$SDK/platforms/android-33"
          test -d "$SDK/build-tools/37.0.0"

          echo "Android SDK is ready."


      # --------------------------------
      # 10. Clean previous build data
      # --------------------------------
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

          echo "Build directories cleaned."


      # --------------------------------
      # 11. Build APK
      # --------------------------------
      - name: Build APK
        env:
          ACCEPT_EULA: "Y"
        run: |
          buildozer android debug


      # --------------------------------
      # 12. Check APK
      # --------------------------------
      - name: Check APK
        run: |
          echo "Generated APK files:"
          ls -lah bin/

          echo
          echo "APK count:"
          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          echo "$APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi


      # --------------------------------
      # 13. Upload APK
      # --------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
