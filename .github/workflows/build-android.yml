name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache \
            libltdl-dev \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install buildozer
          python -m pip install "cython==0.29.36"

          echo "Buildozer:"
          buildozer --version

          echo "Cython:"
          cython --version

      - name: Configure Android environment
        run: |
          SDK="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=23" >> "$GITHUB_ENV"

          echo "SDK: $SDK"

          test -f "$SDK/cmdline-tools/latest/bin/sdkmanager"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK components
        run: |
          set -e

          SDK="$ANDROID_HOME"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Checking SDK..."

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          test -f "$SDK/build-tools/35.0.0/aidl"

          echo "SDK installation OK."

      - name: Create Buildozer sdkmanager wrapper
        run: |
          set -e

          SDK="$ANDROID_HOME"

          echo "Creating legacy tools/bin directory..."

          sudo mkdir -p "$SDK/tools/bin"

          echo "Creating sdkmanager wrapper..."

          sudo tee "$SDK/tools/bin/sdkmanager" > /dev/null <<'EOF'
#!/bin/bash
exec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@"
EOF

          sudo chmod +x "$SDK/tools/bin/sdkmanager"

          echo "Testing Buildozer sdkmanager..."

          test -f "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

          echo "Buildozer sdkmanager OK."

      - name: Verify Android tools
        run: |
          set -e

          SDK="$ANDROID_HOME"

          echo "Modern sdkmanager:"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo "Buildozer sdkmanager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo "ADB:"
          "$SDK/platform-tools/adb" version

          echo "AIDL:"
          "$SDK/build-tools/35.0.0/aidl" --version

      - name: Verify Frahoosh project
        run: |
          set -e

          test -f buildozer.spec
          test -d mobile

          echo "buildozer.spec:"
          cat buildozer.spec

          echo "Mobile files:"
          find mobile -maxdepth 4 -type f -print | sort

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Build APK
        env:
          ACCEPT_EULA: "Y"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -e

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "Cython:"
          cython --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "sdkmanager:"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

          echo "Starting Buildozer..."

          buildozer android debug

      - name: Check APK
        run: |
          set -e

          echo "APK files:"
          ls -lah bin/

          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo "APK generated successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
