name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config cmake \
            build-essential libffi-dev libssl-dev zlib1g-dev libncurses5-dev \
            libncursesw5-dev libltdl-dev

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"

      - name: Verify source
        run: |
          test -f buildozer.spec
          test -f mobile/main.py
          python -m compileall -q mobile

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          yes | buildozer -v android debug

      - name: Verify APK
        run: |
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p output
          cp "$APK" output/Frahoosh-Mobile.apk
          unzip -t output/Frahoosh-Mobile.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose output/Frahoosh-Mobile.apk
          sha256sum output/Frahoosh-Mobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-APK
          path: output/Frahoosh-Mobile.apk
          if-no-files-found: error
