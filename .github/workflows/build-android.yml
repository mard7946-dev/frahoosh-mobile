name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------
      # 1. Checkout
      # --------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Python 3.11
      # --------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------
      # 3. Java 17
      # --------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------
      # 4. System dependencies
      # --------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache


      # --------------------------------
      # 5. Configure Android SDK
      # --------------------------------
      - name: Configure Android SDK
        run: |

          SDK="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"

          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$SDK"

          echo "SDK contents:"
          ls -lah "$SDK"


      # --------------------------------
      # 6. Install exact Android SDK
      # --------------------------------
      - name: Install Android SDK components
        run: |

          SDK="/usr/local/lib/android/sdk"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true

          echo "Installing required SDK packages..."

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

          echo "SDK packages installed."


      # --------------------------------
      # 7. Remove incompatible Build Tools
      # --------------------------------
      - name: Remove incompatible Build Tools
        run: |

          SDK="/usr/local/lib/android/sdk"

          echo "Installed Build Tools before cleanup:"
          ls -lah "$SDK/build-tools" || true

          if [ -d "$SDK/build-tools/37.0.0" ]; then
            echo "Removing Build Tools 37.0.0..."
            rm -rf "$SDK/build-tools/37.0.0"
          fi

          echo "Installed Build Tools after cleanup:"
          ls -lah "$SDK/build-tools"


      # --------------------------------
      # 8. Verify AIDL
      # --------------------------------
      - name: Verify Android SDK
        run: |

          SDK="/usr/local/lib/android/sdk"

          AIDL="$SDK/build-tools/35.0.0/aidl"

          echo "Checking AIDL:"
          echo "$AIDL"

          if [ ! -x "$AIDL" ]; then
            echo "ERROR: AIDL was not installed."
            exit 1
          fi

          echo "AIDL FOUND"

          "$AIDL" --help > /dev/null

          echo "AIDL is working."


      # --------------------------------
      # 9. Install Buildozer
      # --------------------------------
      - name: Install Buildozer
        run: |

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          pip install buildozer

          pip install "cython==0.29.36"


      # --------------------------------
      # 10. Verify Buildozer configuration
      # --------------------------------
      - name: Verify Buildozer configuration
        run: |

          echo "===== buildozer.spec ====="

          cat buildozer.spec

          echo
          echo "===== SDK ====="

          echo "$ANDROID_HOME"

          echo
          echo "===== Build Tools ====="

          ls -lah \
            "$ANDROID_HOME/build-tools/35.0.0"

          echo
          echo "===== Platform ====="

          ls -lah \
            "$ANDROID_HOME/platforms/android-33"


      # --------------------------------
      # 11. Clean Buildozer
      # --------------------------------
      - name: Clean Buildozer
        run: |

          rm -rf .buildozer
          rm -rf bin

          echo "Buildozer directories cleaned."


      # --------------------------------
      # 12. Build APK
      # --------------------------------
      - name: Build APK
        env:
          ACCEPT_EULA: "Y"
        run: |

          buildozer android debug


      # --------------------------------
      # 13. Check APK
      # --------------------------------
      - name: Check APK
        run: |

          echo "===== Generated APK files ====="

          ls -lah bin/

          echo
          echo "APK count:"

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | wc -l


      # --------------------------------
      # 14. Upload APK
      # --------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
