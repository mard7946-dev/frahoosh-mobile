name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # -----------------------------
      # 1. Checkout
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # -----------------------------
      # 2. Setup Python
      # -----------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # -----------------------------
      # 3. Setup Java 17
      # -----------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # -----------------------------
      # 4. Install system dependencies
      # -----------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # -----------------------------
      # 5. Install Buildozer
      # -----------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.36"


      # -----------------------------
      # 6. Accept Android SDK licenses
      # -----------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true


      # -----------------------------
      # 7. Clean previous Buildozer files
      # -----------------------------
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin


      # -----------------------------
      # 8. Build APK
      # -----------------------------
      - name: Build APK
        env:
          P4A_RELEASE: "0"
        run: |
          buildozer android debug


      # -----------------------------
      # 9. List generated APK
      # -----------------------------
      - name: Check APK
        run: |
          echo "Generated APK files:"
          ls -lah bin/


      # -----------------------------
      # 10. Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
