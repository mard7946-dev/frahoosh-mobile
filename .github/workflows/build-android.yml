name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev \
            ccache

      - name: Install Python build tools
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install "Cython==0.29.36"
          python -m pip install buildozer

          echo "Python:"
          python --version

          echo "Cython:"
          cython --version

          echo "Buildozer:"
          buildozer --version

      - name: Verify project
        run: |
          set -e

          echo "========================================"
          echo "VERIFY PROJECT"
          echo "========================================"

          test -f buildozer.spec
          test -d mobile
          test -f mobile/main.py

          echo "Python syntax check..."
          python -m compileall -q mobile

          echo "Project files:"
          find mobile -type f \
            ! -path "*/__pycache__/*" \
            | sort

          echo "Project verification completed."

      - name: Prepare Buildozer configuration
        run: |
          set -e

          echo "========================================"
          echo "PREPARE BUILDOZER"
          echo "========================================"

          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          text = path.read_text()

          replacements = {
              "android.api": "35",
              "android.minapi": "23",
              "android.ndk": "28c",
              "android.accept_sdk_license": "True",
          }

          lines = text.splitlines()
          output = []

          for line in lines:
              stripped = line.strip()

              replaced = False

              for key, value in replacements.items():
                  if stripped.startswith(key + " ="):
                      output.append(f"{key} = {value}")
                      replaced = True
                      break

              if not replaced:
                  output.append(line)

          path.write_text("\n".join(output) + "\n")

          print("buildozer.spec:")
          print(path.read_text())
          PY

      - name: Clean Buildozer
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      - name: Initialize Buildozer Android platform
        run: |
          set -e

          echo "========================================"
          echo "INITIALIZE BUILDOZER ANDROID PLATFORM"
          echo "========================================"

          buildozer android clean || true

          buildozer android update || true

          echo "Buildozer platform initialization completed."

      - name: Accept Android SDK licenses
        run: |
          set -e

          echo "========================================"
          echo "ACCEPT ANDROID SDK LICENSES"
          echo "========================================"

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "SDK:"
          echo "$SDK"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Buildozer SDK directory was not created."
            exit 1
          fi

          echo "SDK contents:"
          find "$SDK" -maxdepth 2 -type d | sort | head -100

          SDKMANAGER=""

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/bin/sdkmanager"
          elif [ -x "$SDK/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/tools/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$SDK" -name sdkmanager -type f -print
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo "Accepting licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          echo "Installing required SDK components..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "SDK installation completed."

          echo "Installed build-tools:"
          ls -lah "$SDK/build-tools"

          echo "Installed platforms:"
          ls -lah "$SDK/platforms"

      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          ACCEPT_EULA: "Y"
        run: |
          set -e

          echo "========================================"
          echo "BUILD FRAHOOSH APK"
          echo "========================================"

          yes | buildozer -v android debug

      - name: Verify APK
        run: |
          set -e

          echo "========================================"
          echo "VERIFY APK"
          echo "========================================"

          echo "bin directory:"
          ls -lah bin/

          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          echo "APK count:"
          echo "$APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          APK=$(find bin -maxdepth 1 -type f -name "*.apk" | head -n 1)

          echo "APK:"
          echo "$APK"

          echo "APK size:"
          ls -lh "$APK"

          echo "APK SHA256:"
          sha256sum "$APK"

          echo "APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
``
