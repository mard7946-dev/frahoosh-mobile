```yaml
name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Python
      # ============================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. Linux dependencies
      # ============================================================
      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache \
            libltdl-dev \
            build-essential


      # ============================================================
      # 5. Buildozer + Cython
      # ============================================================
      - name: Install Buildozer
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install buildozer

          python -m pip install "cython==0.29.36"

          echo "========================================"
          echo "Buildozer version"
          echo "========================================"
          buildozer --version

          echo "========================================"
          echo "Cython version"
          echo "========================================"
          cython --version


      # ============================================================
      # 6. Android SDK environment
      # ============================================================
      - name: Configure Android SDK
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "========================================"
          echo "Android SDK"
          echo "========================================"

          test -d "$SDK"

          echo "SDK:"
          echo "$SDK"

          echo ""
          echo "Modern sdkmanager:"
          test -f "$SDK/cmdline-tools/latest/bin/sdkmanager"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version


      # ============================================================
      # 7. Create Buildozer legacy SDK compatibility path
      #
      # Buildozer used by this project looks for:
      #
      #   $SDK/tools/bin/sdkmanager
      #
      # Modern Android SDK provides:
      #
      #   $SDK/cmdline-tools/latest/bin/sdkmanager
      #
      # Instead of modifying Buildozer source code, create a real
      # compatibility path inside the existing SDK.
      # ============================================================
      - name: Prepare SDK compatibility path
        run: |
          set -e

          SDK="$ANDROID_HOME"
          MODERN="$SDK/cmdline-tools/latest"

          echo "========================================"
          echo "Preparing SDK compatibility path"
          echo "========================================"

          test -d "$MODERN"
          test -f "$MODERN/bin/sdkmanager"

          echo "Removing old compatibility path if present..."

          if [ -e "$SDK/tools" ] || [ -L "$SDK/tools" ]; then
            rm -rf "$SDK/tools"
          fi

          echo "Creating:"
          echo "$SDK/tools -> $MODERN"

          ln -s "$MODERN" "$SDK/tools"

          echo ""
          echo "Checking legacy path..."

          test -f "$SDK/tools/bin/sdkmanager"

          echo ""
          echo "Legacy sdkmanager:"
          "$SDK/tools/bin/sdkmanager" --version


      # ============================================================
      # 8. Accept licenses and install exact SDK components
      # ============================================================
      - name: Install Android SDK components
        run: |
          set -e

          SDK="$ANDROID_HOME"
          SDKMANAGER="$SDK/tools/bin/sdkmanager"

          echo "========================================"
          echo "Android SDK installation"
          echo "========================================"

          test -f "$SDKMANAGER"

          echo "sdkmanager:"
          "$SDKMANAGER" --version

          echo ""
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          echo ""
          echo "Installing required Android packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Installed platforms:"
          find "$SDK/platforms" -maxdepth 1 -mindepth 1 -type d -print | sort || true

          echo ""
          echo "Installed build-tools:"
          find "$SDK/build-tools" -maxdepth 1 -mindepth 1 -type d -print | sort || true

          echo ""
          echo "AIDL:"
          test -x "$SDK/build-tools/35.0.0/aidl"
          "$SDK/build-tools/35.0.0/aidl" 2>&1 || true


      # ============================================================
      # 9. Tell Buildozer to use GitHub's preinstalled SDK
      #
      # IMPORTANT:
      # We do NOT patch buildozer/targets/android.py anymore.
      # ============================================================
      - name: Configure buildozer.spec SDK path
        run: |
          set -e

          SDK="$ANDROID_HOME"

          echo "========================================"
          echo "Configuring buildozer.spec"
          echo "========================================"

          python - "$SDK" <<'PY'
          import sys
          from pathlib import Path

          sdk = sys.argv[1]
          path = Path("buildozer.spec")

          text = path.read_text()

          lines = text.splitlines()

          # Remove previous android.sdk_path entries.
          filtered = []

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("android.sdk_path"):
                  continue

              filtered.append(line)

          text = "\n".join(filtered) + "\n"

          # Find [app] section and insert SDK path there.
          lines = text.splitlines()

          result = []
          inserted = False

          for line in lines:
              result.append(line)

              if line.strip() == "[app]" and not inserted:
                  result.append(
                      "android.sdk_path = " + sdk
                  )
                  inserted = True

          if not inserted:
              raise SystemExit("ERROR: [app] section not found in buildozer.spec")

          path.write_text("\n".join(result) + "\n")

          print("android.sdk_path configured:")
          print(sdk)
          PY

          echo ""
          echo "Current SDK configuration:"
          grep -n "android.sdk_path" buildozer.spec

          echo ""
          echo "Buildozer spec:"
          cat buildozer.spec


      # ============================================================
      # 10. Verify project
      # ============================================================
      - name: Verify Frahoosh project
        run: |
          set -e

          echo "========================================"
          echo "Frahoosh project"
          echo "========================================"

          echo ""
          echo "Root:"
          pwd

          echo ""
          echo "Files:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            ! -path "./.buildozer/*" \
            | sort

          echo ""
          echo "Mobile:"
          find mobile -maxdepth 4 -type f -print | sort

          echo ""
          echo "buildozer.spec:"
          cat buildozer.spec


      # ============================================================
      # 11. Clean old Buildozer cache
      # ============================================================
      - name: Clean Buildozer
        run: |
          set -e

          echo "Cleaning old Buildozer state..."

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Clean complete."


      # ============================================================
      # 12. Verify Buildozer sees the correct SDK
      # ============================================================
      - name: Verify Buildozer SDK configuration
        run: |
          set -e

          SDK="$ANDROID_HOME"

          echo "========================================"
          echo "Final SDK verification"
          echo "========================================"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Modern sdkmanager:"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo ""
          echo "Legacy compatibility sdkmanager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo ""
          echo "Platform:"
          test -d "$SDK/platforms/android-35"

          echo ""
          echo "Build tools:"
          test -d "$SDK/build-tools/35.0.0"

          echo ""
          echo "AIDL:"
          test -f "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "buildozer.spec SDK:"
          grep "android.sdk_path" buildozer.spec


      # ============================================================
      # 13. Build APK
      # ============================================================
      - name: Build APK
        env:
          ACCEPT_EULA: "Y"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -e

          echo "========================================"
          echo "Starting Frahoosh Android build"
          echo "========================================"

          buildozer android debug


      # ============================================================
      # 14. Check APK
      # ============================================================
      - name: Check APK
        run: |
          set -e

          echo "========================================"
          echo "APK result"
          echo "========================================"

          if ! find bin -maxdepth 1 -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK was generated."
            echo ""
            echo "Contents of bin:"
            ls -lah bin || true
            exit 1
          fi

          echo ""
          echo "Generated APK:"
          ls -lah bin/*.apk

          echo ""
          echo "APK count:"
          find bin -maxdepth 1 -type f -name "*.apk" | wc -l

          echo ""
          echo "APK successfully generated."


      # ============================================================
      # 15. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
```
