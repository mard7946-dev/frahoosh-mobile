name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------
      # 1. Checkout
      # --------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Python 3.11
      # --------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------
      # 3. Java 17
      # --------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------
      # 4. System dependencies
      # --------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache


      # --------------------------------
      # 5. Install Buildozer
      # --------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install "cython==0.29.36"


      # --------------------------------
      # 6. Configure Android environment
      # --------------------------------
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

          echo "ANDROIDSDK=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=/home/runner/.buildozer/android/platform/android-ndk-r28c" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"


      # --------------------------------
      # 7. Accept Android SDK licenses
      # --------------------------------
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-33" \
              "build-tools;35.0.0" || true
          else
            echo "sdkmanager not found."
          fi


      # --------------------------------
      # 8. Clean previous Buildozer data
      # --------------------------------
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin


      # --------------------------------
      # 9. Build APK
      # --------------------------------
      - name: Build APK
        env:
          ACCEPT_EULA: "Y"
        run: |
          buildozer android debug


      # --------------------------------
      # 10. Check APK
      # --------------------------------
      - name: Check APK
        run: |
          echo "Generated APK files:"
          ls -lah bin/

          echo "APK count:"
          find bin -maxdepth 1 -type f -name "*.apk" | wc -l


      # --------------------------------
      # 11. Upload APK
      # --------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
