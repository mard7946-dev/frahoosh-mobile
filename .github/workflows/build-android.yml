name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 4. System dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache

      # 5. Python build tools
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install "cython==0.29.36"

      # 6. Configure Android SDK
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          echo "SDK=$SDK"

          echo "Searching for sdkmanager..."

          SDKMANAGER=""

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/bin/sdkmanager"
          elif [ -x "$SDK/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/tools/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$SDK" -name sdkmanager -type f -print || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version

      # 7. Install exact Android SDK components
      - name: Install Android SDK components
        run: |
          set -e

          SDK="$ANDROID_HOME"
          SDKMANAGER="$SDKMANAGER"

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses

          echo "Installing required SDK packages..."

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;37.0.0"

          echo "Installed build-tools:"
          ls -la "$SDK/build-tools"

          echo "Installed platforms:"
          ls -la "$SDK/platforms"

          echo "Checking AIDL..."

          AIDL="$SDK/build-tools/37.0.0/aidl"

          if [ ! -x "$AIDL" ]; then
            echo "ERROR: AIDL was not installed:"
            echo "$AIDL"
            exit 1
          fi

          echo "AIDL FOUND:"
          "$AIDL" --help >/dev/null

          echo "AIDL check passed."

      # 8. Configure Android environment
      - name: Configure Android environment
        run: |
          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"
          echo "NDKAPI=24" >> "$GITHUB_ENV"

      # 9. Remove previous Buildozer state
      - name: Clean Buildozer state
        run: |
          rm -rf .buildozer
          rm -rf bin

      # 10. Build APK
      - name: Build APK
        env:
          ACCEPT_EULA: "Y"
        run: |
          buildozer android debug

      # 11. Check APK
      - name: Check APK
        run: |
          echo "Generated APK files:"
          ls -lah bin/

          echo "APK count:"
          find bin -maxdepth 1 -type f -name "*.apk" | wc -l

          if ! find bin -maxdepth 1 -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
