name: Build Frahoosh APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install "Cython>=3.0,<4"
          python -m pip install build

      - name: Install python-for-android
        run: |
          python -m pip install "python-for-android==2024.1.21"

      - name: Verify tools
        run: |
          echo "Python:"
          python --version

          echo "Cython:"
          cython --version

          echo "python-for-android:"
          python -m pythonforandroid.toolchain --help

      - name: Check project
        run: |
          echo "Project:"
          pwd

          echo "Mobile files:"
          find mobile -maxdepth 3 -type f -print

      - name: Build APK
        run: |
          python -m pythonforandroid.toolchain apk \
            --private "$GITHUB_WORKSPACE/mobile" \
            --package org.frahoosh.mobile \
            --name "Frahoosh Mobile" \
            --version 1.0.0 \
            --bootstrap sdl2 \
            --requirements python3,kivy,requests \
            --android-api 35 \
            --ndk-api 24 \
            --arch arm64-v8a \
            --color=always \
            --debug

      - name: Find APK
        if: always()
        run: |
          echo "Searching for APK..."

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: |
            bin/*.apk
            dist/*.apk
            *.apk
          if-no-files-found: error
