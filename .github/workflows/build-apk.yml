name: Build Frahoosh APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install "cython==0.29.37"

      - name: Clean Buildozer cache
        run: |
          echo "Removing old Buildozer environment..."
          rm -rf "$HOME/.buildozer"
          rm -rf "$GITHUB_WORKSPACE/.buildozer"

          echo "Buildozer cache removed."

      - name: Show Build Configuration
        run: |
          echo "Python:"
          python --version

          echo "Buildozer:"
          buildozer version

          echo "Workspace:"
          pwd

          echo "Buildozer directory:"
          ls -la "$HOME" || true

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Show APK
        if: always()
        run: |
          echo "APK files:"
          find "$GITHUB_WORKSPACE/bin" -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
