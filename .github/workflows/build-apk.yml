name: Build Frahoosh APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull official Buildozer image
        run: |
          docker pull kivy/buildozer:latest

      - name: Prepare Android SDK
        run: |
          docker run --rm \
            --volume "$HOME/.buildozer:/home/user/.buildozer" \
            --volume "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            kivy/buildozer:latest \
            bash -lc '
              SDK="/home/user/.buildozer/android/platform/android-sdk"

              echo "Searching for sdkmanager..."

              SDKMANAGER=$(find "$SDK" -name sdkmanager -type f | head -n 1)

              echo "SDKMANAGER=$SDKMANAGER"

              if [ -z "$SDKMANAGER" ]; then
                echo "ERROR: sdkmanager not found"
                exit 1
              fi

              yes | "$SDKMANAGER" --licenses

              "$SDKMANAGER" \
                "platform-tools" \
                "platforms;android-35" \
                "build-tools;35.0.0" \
                "ndk;27.2.12479018"

              echo "Android SDK preparation completed."
            '

      - name: Verify Android SDK
        run: |
          docker run --rm \
            --volume "$HOME/.buildozer:/home/user/.buildozer" \
            kivy/buildozer:latest \
            bash -lc '
              SDK="/home/user/.buildozer/android/platform/android-sdk"

              echo "Checking Build Tools 35..."

              test -f "$SDK/build-tools/35.0.0/aidl"

              "$SDK/build-tools/35.0.0/aidl" --version

              echo "AIDL is available."
            '

      - name: Build APK
        run: |
          docker run --rm \
            --volume "$HOME/.buildozer:/home/user/.buildozer" \
            --volume "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            kivy/buildozer:latest \
            bash -lc '
              cd /home/user/hostcwd

              export ANDROID_HOME="/home/user/.buildozer/android/platform/android-sdk"
              export ANDROID_SDK_ROOT="$ANDROID_HOME"

              export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"

              echo "Running user:"
              whoami

              echo "Checking AIDL:"
              "$ANDROID_HOME/build-tools/35.0.0/aidl" --version

              echo "Starting Buildozer..."

              buildozer android debug
            '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
