name: Build Frahoosh Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config cmake build-essential libffi-dev libssl-dev zlib1g-dev libncurses5-dev libncursesw5-dev libltdl-dev

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Configure Android environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36"
          python -m pip install "buildozer==1.5.0"

      - name: Verify project
        run: |
          test -f buildozer.spec
          test -f mobile/main.py
          python -m compileall -q mobile
          buildozer --version

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Verify APK
        run: |
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p output
          cp "$APK" output/Frahoosh-Mobile.apk
          ls -lh output/Frahoosh-Mobile.apk
          sha256sum output/Frahoosh-Mobile.apk
          unzip -t output/Frahoosh-Mobile.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose output/Frahoosh-Mobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-APK
          path: output/Frahoosh-Mobile.apk
          if-no-files-found: error
